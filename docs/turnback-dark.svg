<circle cx="106" cy="414" r="5" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
<text x="117.0" y="418.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">where the farmer pressed Turn back</text>
<circle cx="336" cy="414" r="3.5" fill="#f0883e"/>
<text x="346.0" y="418.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">home, 10 m inside</text>
<line x1="600" y1="30" x2="600" y2="410" stroke="#30363d"/>
<text x="626.0" y="42.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">One API call, one transaction</text>
<rect x="626" y="70" width="346" height="40" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="640.0" y="87.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">End the current move</text>
<text x="640.0" y="103.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">now</text>
<rect x="626" y="120" width="346" height="40" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="640.0" y="137.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Start a new one</text>
<text x="640.0" y="153.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">same collars, same lane, path reversed</text>
<rect x="626" y="170" width="346" height="40" rx="9" fill="#161b22" stroke="#30363d"/>
<text x="640.0" y="187.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="600">Point every collar</text>
<text x="640.0" y="203.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">back at the old paddock</text>
<text x="626.0" y="244.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="normal">Not started yet: simply cancelled.</text>
<text x="626.0" y="262.0" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Herd changed meanwhile: 409, nothing half-done.</text>
<text x="626.0" y="306.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">No turn-back code on the collar</text>
<text x="626.0" y="334.0" font-size="12.5" fill="#f0883e" text-anchor="start" font-weight="700">In the lane</text>
<text x="760.0" y="334.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="normal">turns, aims 5 m ahead toward home</text>
<text x="626.0" y="356.0" font-size="12.5" fill="#f0883e" text-anchor="start" font-weight="700">In the old paddock</text>
<text x="760.0" y="356.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="normal">already home</text>
<text x="626.0" y="378.0" font-size="12.5" fill="#f0883e" text-anchor="start" font-weight="700">In the new paddock</text>
<text x="760.0" y="378.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="normal">heads for its gate, then the lane</text>
<text x="626.0" y="406.0" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Where to aim depends only on where she is.</text>
</svg>