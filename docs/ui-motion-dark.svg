<circle cx="900" cy="190" r="7" fill="#e6edf3"/>
<text x="900.0" y="272.0" font-size="13.5" fill="#f85149" text-anchor="middle" font-weight="700">pulse</text>
<text x="900.0" y="292.0" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">every 350 ms</text>
<text x="526.0" y="334.0" font-size="12.5" fill="#e6edf3" text-anchor="start" font-weight="normal">Only the ripple layer's paint changes each frame, not the data,</text>
<text x="526.0" y="352.0" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">and the loop only runs while some cow is being cued.</text>
