<text x="750.0" y="272.0" font-size="13.5" fill="#f0883e" text-anchor="middle" font-weight="700">vibration</text>
<text x="750.0" y="292.0" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">every 600 ms</text>
<circle cx="900" cy="190" r="22.0" fill="none" stroke="#f85149" stroke-width="3" stroke-opacity="1.00"/>
