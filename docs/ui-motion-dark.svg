<text x="526.0" y="42.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">Cue ripples: harder cue, faster pulse</text>
<text x="526.0" y="62.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">radius × (1 + 1.5·phase), opacity 1 − phase</text>
