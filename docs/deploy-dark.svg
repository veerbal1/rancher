<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
</defs>
<rect x="1" y="1" width="998" height="328" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="28.0" y="42.0" font-size="16" fill="#3fb950" text-anchor="start" font-weight="700">./scripts/up.sh</text>
<text x="160.0" y="42.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">one command, about 10 minutes, mostly CloudFront</text>
<rect x="28" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="48" cy="88" r="10" fill="#3fb950"/>
<text x="48.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">1</text>
<text x="64.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Build</text>
<text x="42.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">5 Lambdas + the sim</text>
<text x="42.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">Go, cross-compiled</text>
<text x="42.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">for ARM (Graviton)</text>
<line x1="174" y1="125" x2="188" y2="125" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="210" cy="88" r="10" fill="#3fb950"/>
<text x="210.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">2</text>
<text x="226.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">terraform apply</text>
<text x="204.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">52 resources:</text>
<text x="204.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">Kinesis, Lambdas,</text>
<text x="204.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">DynamoDB, EC2, CDN</text>
<line x1="336" y1="125" x2="350" y2="125" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="352" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="372" cy="88" r="10" fill="#3fb950"/>
<text x="372.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">3</text>
<text x="388.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Map key</text>
<text x="366.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">create or update</text>
<text x="366.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">rancher-web, limited to</text>
<text x="366.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">the new domain</text>
<line x1="498" y1="125" x2="512" y2="125" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="514" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="534" cy="88" r="10" fill="#3fb950"/>
<text x="534.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">4</text>
<text x="550.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Wire the UI</text>
<text x="528.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">new API, WebSocket</text>
<text x="528.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">and key into</text>
<text x="528.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">ui/.env.local</text>
<line x1="660" y1="125" x2="674" y2="125" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="696" cy="88" r="10" fill="#3fb950"/>
<text x="696.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">5</text>
<text x="712.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Seed</text>
<text x="690.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">a Demo Farm with</text>
<text x="690.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">2 paddocks and</text>
<text x="690.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">12 collars, if empty</text>
<line x1="822" y1="125" x2="836" y2="125" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="838" y="66" width="144" height="118" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="858" cy="88" r="10" fill="#3fb950"/>
<text x="858.0" y="92.5" font-size="12" fill="#0d1117" text-anchor="middle" font-weight="700">6</text>
<text x="874.0" y="93.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="700">Ship the UI</text>
<text x="852.0" y="122.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">build, sync to S3,</text>
<text x="852.0" y="140.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">clear CloudFront,</text>
<text x="852.0" y="158.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">print the link</text>
<text x="28.0" y="232.0" font-size="16" fill="#f85149" text-anchor="start" font-weight="700">./scripts/down.sh</text>
<text x="182.0" y="232.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">terraform destroy, then delete the Lambda log groups Terraform doesn't know about</text>
<rect x="28" y="252" width="944" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="46.0" y="283.0" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">Left behind: nothing that bills.</text>
<text x="262.0" y="283.0" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">The rancher-web map key stays (keys are free) and is re-pointed at the next domain on the next up.</text>
</svg>