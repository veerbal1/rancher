<rect x="16" y="682" width="968" height="24" rx="6" fill="#f6f8fa"/>
<text x="28.0" y="699.0" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="700">4 · If pushes stop</text>
<rect x="20.0" y="718" width="609.0" height="26" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
<text x="324.5" y="735.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">no push for 3 s: poll cow-api every second, reconnect after 2 s, drop cows silent for 10 s</text>
