<line x1="816" y1="580" x2="672" y2="580" stroke="#d64545" stroke-width="1.8" marker-end="url(#a-gone)"/>
<text x="742.0" y="574.0" font-size="12" fill="#d64545" text-anchor="middle" font-weight="600">delete id</text>
<line x1="80" y1="610" x2="368" y2="610" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-msg)"/>
<text x="226.0" y="604.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">close tab</text>
<line x1="372" y1="640" x2="516" y2="640" stroke="#1f2328" stroke-width="1.8" marker-end="url(#a-msg)"/>
<text x="446.0" y="634.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">$disconnect</text>
