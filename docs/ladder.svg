</g>
<text x="889.0" y="297.0" font-size="12" fill="#656d76" text-anchor="end" font-weight="600">0 s</text>
<g transform="translate(905.0,262.0) rotate(-40.0)">
<ellipse cx="0" cy="6" rx="7" ry="11" fill="#1f2328"/>
