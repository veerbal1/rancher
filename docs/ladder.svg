<circle cx="7" cy="-7.5" r="3.6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.3"/>
</g>
<circle cx="880.2" cy="203.9" r="9" fill="#d4a700"/>
<text x="880.2" y="208.4" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<g transform="translate(831.8,219.7) rotate(-120.0)">
<ellipse cx="0" cy="6" rx="7" ry="11" fill="#1f2328"/>
<ellipse cx="0" cy="-9" rx="4.2" ry="5.5" fill="#1f2328"/>
<circle cx="-7" cy="-7.5" r="3.6" fill="#afb8c1" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="7" cy="-7.5" r="3.6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.3"/>
</g>
<circle cx="819.8" cy="198.9" r="9" fill="#d4a700"/>
<text x="819.8" y="203.4" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<line x1="792.8" y1="242.2" x2="766.8" y2="257.2" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arrow-text)"/>
<text x="786.8" y="276.2" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">walks off</text>
<text x="652.0" y="330.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">1, 2, 3: a sound and a 40° left turn each second.</text>
<text x="652.0" y="350.0" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">At 120° away the cue stops. No vibration needed.</text>
