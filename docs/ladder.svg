<line x1="905.0" y1="250.0" x2="905.0" y2="88.0" stroke="#656d76" stroke-width="1.2" stroke-dasharray="2 4"/>
<path d="M897,168 l8,-5 l8,5 M897,176 l8,-5 l8,5" fill="none" stroke="#656d76" stroke-width="1.4"/>
<text x="915.0" y="130.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="600">10 m</text>
