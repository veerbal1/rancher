<text x="40.0" y="278.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">0 s</text>
<line x1="200.0" y1="234.0" x2="200.0" y2="242.0" stroke="#656d76" stroke-width="1.2"/>
<text x="200.0" y="278.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">8 s</text>
<line x1="360.0" y1="234.0" x2="360.0" y2="242.0" stroke="#656d76" stroke-width="1.2"/>
<text x="360.0" y="278.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">16 s</text>
<line x1="520.0" y1="234.0" x2="520.0" y2="242.0" stroke="#656d76" stroke-width="1.2"/>
<text x="520.0" y="278.0" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">24 s</text>
<text x="28.0" y="330.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal">Every 8 s she stays threatened, the cue steps up. Each second a cue is on, she turns away.</text>
<text x="28.0" y="350.0" font-size="13" fill="#656d76" text-anchor="start" font-weight="normal">After a pulse the collar gives up rather than keep shocking her, and waits until she settles.</text>
<text x="652.0" y="42.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Head-on at 10 m: three sounds</text>
<rect x="652" y="84" width="320" height="216" fill="#2e9e5b1c"/>
<line x1="652.0" y1="84.0" x2="972.0" y2="84.0" stroke="#2e9e5b" stroke-width="3"/>
