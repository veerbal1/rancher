<text x="270.0" y="164.0" font-size="15" fill="#e8710a" text-anchor="start" font-weight="700">60°</text>
<text x="280.0" y="254.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">60° per second</text>
<rect x="362" y="200" width="156" height="30" rx="7" fill="#d64545" fill-opacity="0.9"/>
<text x="440.0" y="220.0" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700">pulse</text>
