<text x="440.0" y="254.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">90° per second</text>
<rect x="522" y="200" width="58" height="30" rx="7" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="551.0" y="220.0" font-size="13.5" fill="#8c959f" text-anchor="middle" font-weight="700">stop</text>
<text x="551.0" y="254.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">until calm 3 s</text>
<line x1="40.0" y1="238.0" x2="584.0" y2="238.0" stroke="#656d76" stroke-width="1.2" marker-end="url(#arrow-muted)"/>
