<rect x="1" y="1" width="998" height="398" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="28.0" y="42.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">The cue ladder: each step is stronger and turns her further</text>
