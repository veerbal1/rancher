<text x="28.0" y="372.0" font-size="13" fill="#58a6ff" text-anchor="start" font-weight="normal">1° of longitude = 111.32 km × cos φ</text>
<text x="361.0" y="42.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">2 · Inside or outside?</text>
