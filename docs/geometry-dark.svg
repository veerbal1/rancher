<text x="972.0" y="108.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" font-style="italic">P′</text>
<circle cx="712" cy="292" r="4" fill="#3fb950"/>
<text x="698.0" y="308.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" font-style="italic">A</text>
<circle cx="934" cy="142" r="4" fill="#3fb950"/>
<text x="944.0" y="162.0" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" font-style="italic">B</text>
<text x="694.0" y="352.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">Project the cow onto each edge, clamp to the</text>
<text x="694.0" y="372.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">segment, keep the closest. Clamped → a corner.</text>
</svg>