<text x="361.0" y="352.0" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="normal">Cast a ray east, count the fence edges it crosses:</text>
<text x="361.0" y="372.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">odd = inside. Works for L-shaped paddocks too.</text>
<text x="694.0" y="42.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">3 · Distance to the fence</text>
