<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="998" height="418" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="28.0" y="42.0" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">When does a 500 m move stop blocking its paddocks?</text>
<text x="28.0" y="62.0" font-size="13" fill="#8b949e" text-anchor="start" font-weight="normal">running = before expiry AND (in the first 30 s OR any of its collars says moving in the last 10 s)</text>
<line x1="236.0" y1="88" x2="236.0" y2="336" stroke="#21262d"/>
<text x="236.0" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">0 min</text>
<line x1="339.4" y1="88" x2="339.4" y2="336" stroke="#21262d"/>
<text x="339.4" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">2 min</text>
<line x1="442.9" y1="88" x2="442.9" y2="336" stroke="#21262d"/>
<text x="442.9" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">4 min</text>
<line x1="546.3" y1="88" x2="546.3" y2="336" stroke="#21262d"/>
<text x="546.3" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">6 min</text>
<line x1="649.7" y1="88" x2="649.7" y2="336" stroke="#21262d"/>
<text x="649.7" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">8 min</text>
<line x1="753.1" y1="88" x2="753.1" y2="336" stroke="#21262d"/>
<text x="753.1" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">10 min</text>
<line x1="856.6" y1="88" x2="856.6" y2="336" stroke="#21262d"/>
<text x="856.6" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">12 min</text>
<line x1="960.0" y1="88" x2="960.0" y2="336" stroke="#21262d"/>
<text x="960.0" y="354.0" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="normal">14 min</text>
<line x1="929.8" y1="84" x2="929.8" y2="336" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="929.8" y="80.0" font-size="11.5" fill="#6e7681" text-anchor="middle" font-weight="700">expiry 13.4 min</text>
<text x="28.0" y="120.0" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">Normal move</text>
<text x="28.0" y="138.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">cows report moving until they arrive</text>
<rect x="236.0" y="106" width="693.8" height="12" rx="6.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="236.0" y="106" width="25.9" height="12" rx="5" fill="#e3b341" fill-opacity="0.9"/>
<rect x="246.3" y="124" width="393.0" height="10" rx="5.0" fill="#58a6ff" fill-opacity="0.85"/>
<rect x="236.0" y="142" width="412.0" height="14" rx="5" fill="#3fb950" fill-opacity="0.9"/>
<text x="656.0" y="154.0" font-size="12.5" fill="#3fb950" text-anchor="start" font-weight="700">ends as the last cow arrives</text>
<text x="28.0" y="200.0" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">No collar ever reports</text>
<text x="28.0" y="218.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">the sim is down, or never picked it up</text>
<rect x="236.0" y="186" width="693.8" height="12" rx="6.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="236.0" y="186" width="25.9" height="12" rx="5" fill="#e3b341" fill-opacity="0.9"/>
<rect x="236.0" y="222" width="25.9" height="14" rx="5" fill="#3fb950" fill-opacity="0.9"/>
<text x="269.9" y="234.0" font-size="12.5" fill="#3fb950" text-anchor="start" font-weight="700">frees the paddocks after 30 s</text>
<text x="28.0" y="280.0" font-size="13.5" fill="#e6edf3" text-anchor="start" font-weight="700">A cow keeps walking</text>
<text x="28.0" y="298.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">one collar still says moving</text>
<rect x="236.0" y="266" width="693.8" height="12" rx="6.0" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="236.0" y="266" width="25.9" height="12" rx="5" fill="#e3b341" fill-opacity="0.9"/>
<rect x="246.3" y="284" width="713.7" height="10" rx="5.0" fill="#58a6ff" fill-opacity="0.85"/>
<rect x="236.0" y="302" width="693.8" height="14" rx="5" fill="#3fb950" fill-opacity="0.9"/>
<text x="919.8" y="313.0" font-size="12.5" fill="#0d1117" text-anchor="end" font-weight="700">capped at expiry</text>
<rect x="28" y="382" width="22" height="10" rx="5" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="58.0" y="392.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">expiry window: walk at 0.8 m/s + 3 min</text>
<rect x="327.20000000000005" y="382" width="22" height="10" rx="4" fill="#e3b341"/>
<text x="357.2" y="392.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">first 30 s</text>
<rect x="447.20000000000005" y="382" width="22" height="10" rx="4" fill="#58a6ff"/>
<text x="477.2" y="392.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">a collar says moving</text>
<rect x="631.2" y="382" width="22" height="10" rx="4" fill="#3fb950"/>
<text x="661.2" y="392.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">running: blocks new moves</text>
</svg>