<text x="230.0" y="240.0" font-size="12.5" fill="#2f6fdb" text-anchor="start" font-weight="600">θ = +45°</text>
<text x="280.5" y="161.5" font-size="12" fill="#2f6fdb" text-anchor="start" font-weight="600">right wall</text>
<line x1="152.0" y1="245.1" x2="62.1" y2="136.8" stroke="#8250df" stroke-width="1.6" stroke-dasharray="2 3"/>
<circle cx="62.1" cy="136.8" r="4.5" fill="#8250df"/>
<path d="M166.0,222.0 A40,40 0 0 0 140.5,231.2" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#arrow-left)"/>
<text x="96.0" y="240.0" font-size="12.5" fill="#8250df" text-anchor="end" font-weight="600">θ = -40°</text>
<text x="50.1" y="154.8" font-size="12" fill="#8250df" text-anchor="end" font-weight="600">left wall</text>
<g transform="translate(166.0,262.0) rotate(0.0)">
<ellipse cx="0" cy="6" rx="8.5" ry="13" fill="#1f2328"/>
<ellipse cx="0" cy="-11" rx="5" ry="6.5" fill="#1f2328"/>
